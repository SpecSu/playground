<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#fffaf3" />
<title>朋友钓鱼 · 神奇钓鱼派对 Friends Fishing Party</title>
<script>/* v1.3：不支持 100dvh 的旧浏览器 → 用可视区高度兜底（main.js 会在 resize / 地址栏变化时继续更新） */
try { if (!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'))) document.documentElement.style.setProperty('--vvh', Math.round((window.visualViewport && visualViewport.height) || innerHeight) + 'px'); } catch (e) {}</script>
<style>
/* =====================================================================
   UI v2 设计系统「暖白派对」—— 对标猛兽派对的易用性：大而圆润 · 图标+文字 · 软立体按压反馈
   底 #fffaf3 / 卡片 #fff / 次级 #fff6ea / 分割 #f1e6d6 · 文字 #3a3330 / 次要 #8a7f74
   主强调 珊瑚粉 #ff7a8a（全局唯一主按钮色）· 点缀 薄荷 / 柠檬 / 葡萄紫 / 天空蓝（标签·稀有度·进度）
   形状：卡片 22px · 按钮 18px/999px · 弥散阴影 + 底部 3-4px 同色系加深「厚度」· 按下下沉、松手回弹
   字号 4 级：12 / 14 / 17 / 24（开屏 Logo 例外）· 线性圆角 SVG 图标 2px
   ===================================================================== */
:root{
  --bg:#fffaf3; --card:#ffffff; --bg2:#fff6ea; --line:#f1e6d6; --edge:#efe2d1;
  --ink:#3a3330; --ink2:#7a6f65; --ink3:#a0948a;
  --pri:#ff7a8a; --pri2:#ff97a3; --pri-d:#e65d70; --pri-l:#ffeef0;
  --mint:#4fd6c0; --mint-d:#2fb7a1; --mint-l:#e3f8f3; --mint-t:#1f8f7d;
  --lemon:#ffd45c; --lemon-d:#e8b42c; --lemon-l:#fff5d3; --lemon-t:#9a6b00;
  --grape:#9b8cff; --grape-d:#7d6ce8; --grape-l:#efecff; --grape-t:#6455c9;
  --sky:#6cc4ff; --sky-d:#45a7ea; --sky-l:#e5f4ff; --sky-t:#2f7fbf;
  --red:#ff6b6b; --red-d:#e04d55;
  --rN:#9db3c2; --rR:#4fd6c0; --rSR:#6cc4ff; --rSSR:#9b8cff; --rUR:#ffb547;
  --sh:0 6px 18px rgba(120,80,40,.12); --sh-s:0 2px 8px rgba(120,80,40,.08); --sh-l:0 18px 44px rgba(90,60,30,.20);
  --thick:0 3px 0 var(--edge);
  --scrim:rgba(58,46,38,.34);
  --r:22px; --rb:18px; --pill:999px;
  --ease:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.3,1.6,.45,1); --dur:.24s;
  --f1:12px; --f2:14px; --f3:17px; --f4:24px;
  --font:ui-rounded,"SF Pro Rounded","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;font-size:var(--f2);font-weight:600}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#fff6ea 0%,#ffe9dc 55%,#f3d9cb 100%)}
/* v1.3 自适应：手机 / 竖屏（宽高比 ≤ 3:4，含 9:16 · 9:19.5 · 9:21 及更长）始终铺满整个可视区（100vw × 100dvh，
   地址栏收起/展开跟随）；--vvh 是不支持 dvh 时由 main.js 用 visualViewport 写入的兜底高度。
   仅桌面宽屏（宽高比 > 3:4）才保留居中手机框（9:19.5）。 */
html,body{height:100vh;height:100dvh;height:var(--vvh,100dvh)}
#app{position:relative;width:100vw;height:100vh;height:100dvh;height:var(--vvh,100dvh);overflow:hidden;background:#bfe7f2}
@media (min-aspect-ratio: 301/400){ #app{height:min(var(--vvh,100dvh), 940px);width:calc(min(var(--vvh,100dvh), 940px) * 0.4615);border-radius:34px;box-shadow:0 30px 80px rgba(90,60,30,.28),0 0 0 10px #fff,0 0 0 12px #f1e6d6} }
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
.off{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus,button:focus-visible{outline:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--card);box-shadow:var(--thick),var(--sh)}
.av{width:32px;height:32px;border-radius:50%;background:var(--bg2) center/cover no-repeat;box-shadow:0 0 0 2px #fff;flex:none;position:relative;overflow:hidden}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 2.5px #fff}
.rb{display:inline-block;font-size:var(--f1);font-weight:800;line-height:20px;color:#fff;padding:0 7px;border-radius:8px;vertical-align:1px;letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.12);flex:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes wig{0%,86%,100%{transform:none}90%{transform:rotate(-1.5deg) scale(1.03)}95%{transform:rotate(1.5deg) scale(1.03)}}

/* ---------- 通用组件：主按钮（珊瑚粉 · 软立体）/ 次按钮 / 图标按钮 / 卡片 ---------- */
.btn-p,#cKeep,#start,.tk-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.02em;transition:transform .32s var(--spring),box-shadow .12s,background .2s,opacity .2s;white-space:nowrap}
.btn-p,#cKeep,.tk-btn.main{width:100%;height:56px;border-radius:var(--rb);font-size:var(--f3);color:#fff;background:linear-gradient(180deg,var(--pri2),var(--pri));box-shadow:0 4px 0 var(--pri-d),0 10px 22px rgba(255,122,138,.30);text-shadow:0 1px 0 rgba(200,60,80,.25)}
.btn-p svg.i,#cKeep svg.i,.tk-btn svg.i{width:22px;height:22px;stroke-width:2.4}
.btn-p:active,#cKeep:active,.tk-btn.main:not(:disabled):active,#start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d),0 4px 10px rgba(255,122,138,.25);transition-duration:.06s}
.tk-btn.main:disabled{color:var(--ink2);background:var(--bg2);box-shadow:0 3px 0 var(--edge);text-shadow:none;cursor:default}
.tk-btn.main.gold,.tk-btn.main.ready{color:#6b4800;background:linear-gradient(180deg,#ffe48c,var(--lemon));box-shadow:0 4px 0 var(--lemon-d),0 10px 22px rgba(232,180,44,.30);text-shadow:none}
.tk-btn.main.gold:not(:disabled):active,.tk-btn.main.ready:not(:disabled):active{box-shadow:0 1px 0 var(--lemon-d)}
.tk-btn.main.ready{animation:tkpulse .8s ease-in-out infinite alternate}
@keyframes tkpulse{to{transform:scale(1.03)}}
.tk-btn.sub{width:100%;height:52px;border-radius:var(--rb);font-size:var(--f2);color:var(--ink);background:#fff;box-shadow:0 3px 0 var(--edge),0 0 0 1.5px var(--line) inset}
.tk-btn.sub b{color:var(--pri-d)}
.tk-btn.sub:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge),0 0 0 1.5px var(--line) inset;transition-duration:.06s}
.tk-btn.ghost{width:100%;height:50px;margin-top:8px;font-size:var(--f2);color:var(--ink);background:var(--bg2);border-radius:var(--rb);box-shadow:0 0 0 1.5px var(--line) inset}
.tk-btn.ghost.sm{display:inline-flex;width:auto;height:44px;margin:0;padding:0 14px;color:var(--ink);background:#fff;border-radius:var(--pill);box-shadow:0 3px 0 var(--edge),0 0 0 1.5px var(--line) inset}
.ib,.tk-x{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--bg2);flex:none;transition:transform .3s var(--spring)}
.ib svg.i,.tk-x svg.i{width:20px;height:20px;stroke-width:2.4}
.ib:active,.tk-x:active{transform:scale(.88);transition-duration:.06s}

/* ---------- 顶栏：头像(等级环) + 今日积分 / 菜单 ---------- */
#top{position:absolute;left:calc(12px + var(--sl));right:calc(12px + var(--sr));top:calc(10px + var(--st));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;z-index:3}
#me{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px 0 6px;border-radius:var(--pill);pointer-events:auto;transition:transform .3s var(--spring)}
#me:active,#menuBtn:active{transform:translateY(2px) scale(.96);transition-duration:.06s}
#me .avw{position:relative;width:40px;height:40px;flex:none}
#me .av{position:absolute;inset:4px;width:auto;height:auto;box-shadow:none}
#me .xpr{position:absolute;inset:0;width:40px;height:40px;transform:rotate(-90deg)}
#me .xpr circle{fill:none;stroke-width:3;stroke-linecap:round}
#me .xpr .t{stroke:var(--line)}
#me .xpr .v{stroke:var(--mint);transition:stroke-dashoffset .6s var(--ease)}
#me .lv{position:absolute;right:-5px;bottom:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--pill);background:var(--pri);color:#fff;font-size:var(--f1);line-height:20px;text-align:center;box-shadow:0 0 0 2px #fff}
#me .sc{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;white-space:nowrap}
#me .sc small{font-size:var(--f1);color:var(--ink2);font-weight:700}
#me .sc b{font-size:var(--f3);color:var(--ink)}
#me.bump .sc b{animation:pulse .3s var(--ease)}
#menuBtn{position:relative;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;color:var(--ink);transition:transform .3s var(--spring)}
#menuBtn svg.i{width:24px;height:24px;stroke-width:2.4}
#menuBtn .dot{top:2px;right:2px}

/* ---------- 社交动态：顶部居中单条白胶囊 ---------- */
#feed{position:absolute;left:50%;top:calc(72px + var(--st));transform:translateX(-50%);max-width:calc(100% - 32px);pointer-events:none;z-index:2;transition:top var(--dur) var(--ease)}
.ui.notop #feed{top:calc(12px + var(--st))}
#ui #feed.atcard{top:var(--ct);left:calc(14px + var(--sl));transform:none;max-width:calc(100% - 28px)}
.fd{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px 4px 4px;border-radius:var(--pill);font-size:var(--f1);font-weight:700;white-space:nowrap;pointer-events:auto;color:var(--ink);background:#fff;box-shadow:var(--thick),var(--sh);animation:fdIn var(--dur) var(--ease) both}
.fd.out{animation:fdOut var(--dur) var(--ease) forwards}
@keyframes fdIn{from{transform:translateY(-10px);opacity:0}}
@keyframes fdOut{to{transform:translateY(-8px);opacity:0}}
.fd .avs{display:flex}
.fd .avs .av{width:30px;height:30px}
.fd .avs .av + .av{margin-left:-10px}
.fd .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mint-l);color:var(--mint-t);flex:none}
.fd .ico svg{width:17px;height:17px}
.fd .tx{overflow:hidden;text-overflow:ellipsis;padding-right:4px;color:var(--ink)}
.fd .tx b{font-weight:800}
.fd .tx .ttl{font-size:var(--f1);color:var(--grape-t);font-weight:800;margin-left:2px}
.fd .tx em{font-style:normal;color:var(--pri-d);font-weight:800}
.fd.cele{background:linear-gradient(90deg,var(--lemon-l),#fff);box-shadow:0 3px 0 #f3dfa6,var(--sh);animation:fdIn var(--dur) var(--ease) both,celeWig .5s ease-in-out .25s 2}
.fd.cele .tx .ttl{color:var(--lemon-t)}
.fd.cele.out{animation:fdOut var(--dur) var(--ease) forwards}
@keyframes celeWig{25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
.fd .fth{width:44px;height:30px;object-fit:contain;margin:0 -2px 0 -4px;opacity:0;transition:opacity .25s}.fd .fth.ok{opacity:1}
.fd .like{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pri-l);color:var(--pri-d);position:relative}
.fd .like::after{content:'';position:absolute;inset:-6px}
.fd .like.done{background:var(--pri);color:#fff}
.fd .like svg{width:17px;height:17px}
.fd.ocean{height:auto;padding-top:6px;padding-bottom:6px;border-radius:20px;width:max-content;max-width:calc(100vw - 32px)}
.fd.ocean .tx{white-space:normal;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fd.ocean.gold{background:linear-gradient(90deg,var(--lemon-l),#fff);box-shadow:0 3px 0 #f3dfa6,var(--sh)}
.fd.ocean.gold .ico{background:var(--lemon);color:#6b4800}

/* ---------- 好友头顶：名字 + 气泡 ---------- */
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* v1.4：环绕观看好友时的顶部小胶囊（点击 / 走动 / 抛竿 → 回到自己） */
#watchChip{position:absolute;left:50%;top:calc(84px + var(--st));z-index:14;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 14px;border:0;border-radius:var(--pill);background:rgba(255,250,243,.95);color:var(--ink);font:800 var(--f2)/1 inherit;box-shadow:var(--thick),var(--sh);opacity:0;transform:translate(-50%,-8px) scale(.94);pointer-events:none;transition:opacity .22s var(--ease),transform .32s var(--spring);white-space:nowrap}
#watchChip.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#watchChip i{width:8px;height:8px;border-radius:50%;background:var(--c,#ff7a8a);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#ff7a8a) 25%,transparent)}
#watchChip b{display:flex;align-items:center;height:26px;padding:0 12px;border-radius:var(--pill);background:var(--pri);color:#fff;font-size:var(--f1)}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transition:opacity var(--dur) var(--ease);will-change:transform}
.tag.show{opacity:1}
.tag .say{position:relative;background:#fff;color:var(--ink);font-size:var(--f1);font-weight:700;padding:6px 12px;border-radius:16px;white-space:nowrap;box-shadow:var(--thick),var(--sh)}
.tag .say::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
.tag .nm{font-size:var(--f1);font-weight:700;color:var(--ink);background:rgba(255,250,243,.88);padding:0 9px;border-radius:var(--pill);line-height:20px;box-shadow:var(--sh-s)}

/* ---------- 咬钩 / 屏幕边缘提示 ---------- */
#bang{position:absolute;left:0;top:0;font-size:56px;font-weight:900;line-height:1;color:#fff;text-shadow:0 4px 0 var(--pri-d),0 0 22px rgba(255,122,138,.8);pointer-events:none;visibility:hidden}
#bang.show{visibility:visible;animation:bang .3s var(--ease)}
#bang::after{content:'';position:absolute;left:50%;top:115%;width:60px;height:8px;margin-left:-30px;border-radius:4px;background:linear-gradient(90deg,var(--lemon) calc(var(--k,1)*100%),rgba(255,255,255,.55) 0);box-shadow:0 2px 0 rgba(120,80,40,.18)}
@keyframes bang{from{transform:translate(var(--x),var(--y)) scale(.3)}}
#edge{position:absolute;inset:0;pointer-events:none;transition:box-shadow var(--dur)}
body.bite #edge{box-shadow:inset 0 0 60px 8px rgba(255,122,138,.5);animation:edge .5s infinite alternate}
body.surge #edge{box-shadow:inset 0 0 90px 18px rgba(255,107,107,.5);animation:edgeR .35s infinite alternate}
body.slack #edge{box-shadow:inset 0 0 70px 12px rgba(255,180,71,.55);animation:edgeR .5s infinite alternate}   /* v2.3：没在收线 3s → 琥珀色预警边框 */
body.strain #edge{box-shadow:inset 0 0 120px 30px rgba(255,80,90,.62);animation:edgeR .2s infinite alternate}
body.frenzy-on #edge{box-shadow:inset 0 0 50px 4px rgba(255,212,92,.35)}
@keyframes edgeR{to{box-shadow:inset 0 0 50px 6px rgba(255,107,107,.3)}}
@keyframes edge{to{box-shadow:inset 0 0 30px 4px rgba(255,122,138,.28)}}

/* ---------- 底部：提示 / 主按钮 + 环 / 摇杆 ---------- */
/* v1.3：主按钮 92→102px、外圈状态环 112→150px 且更粗；按钮正上方加「状态条」#actTag（蓄力/完美区/咬钩/张力），
   拇指按住按钮时环的右下段会被挡住 → 关键状态在按钮上方 + 环的左上段（完美区 / 红色危险区都落在左上）始终可见 */
/* v0.8：状态条/距离挪到主按钮左侧成列 → 按钮正上方让给新手引导，气泡下移贴近按钮（外环顶 168px + 16px 呼吸） */
#hint{position:absolute;right:calc(16px + var(--sr));bottom:calc(184px + var(--sb));max-width:76%;font-size:var(--f2);font-weight:700;color:var(--ink);background:rgba(255,250,243,.94);padding:9px 16px;border-radius:var(--pill);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:var(--thick),var(--sh)}
/* v1.4：幸运饵按钮下线 → 底部只剩「摇杆 · 主按钮」两件，圆心对称（距各自角落 86px / 底边 92px），视觉重心左右平衡 */
#act{position:absolute;right:calc(34px + var(--sr));bottom:calc(40px + var(--sb));width:104px;height:104px;border-radius:50%;pointer-events:auto;touch-action:none}
#act::before{content:'';position:absolute;inset:-22px;border-radius:50%}   /* 触控热区随外环放大 */
#act .ring{position:absolute;left:-24px;top:-24px;width:152px;height:152px;pointer-events:none;transform:rotate(-90deg);overflow:visible}
#act .ring circle{fill:none;stroke-width:7;stroke-linecap:round;transition:opacity var(--dur),stroke .12s}
#act .ring .t{stroke:rgba(255,255,255,.6);opacity:0;filter:drop-shadow(0 1px 2px rgba(90,60,30,.25))}
#act .ring .z{stroke:var(--lemon);opacity:0;stroke-linecap:butt;stroke-width:13;filter:drop-shadow(0 0 4px rgba(255,212,92,.9))}
#act .ring .v{stroke-width:8}
/* 状态条：按钮正上方（手指覆盖范围外），蓄力 / 咬钩 / 搏鱼时出现 */
/* v0.8：状态条 + 距离胶囊统一收到主按钮左侧，右对齐成一列（同高 34px · 同间距）；蓄力/咬钩时只有状态条 → 与按钮圆心对齐，搏鱼时两条上下排列 */
#actTag{position:absolute;right:calc(100% + 34px);top:50%;transform:translate(6px,-50%);transform-origin:right center;height:34px;display:flex;align-items:center;gap:7px;padding:0 13px 0 10px;border-radius:var(--pill);background:rgba(255,250,243,.96);box-shadow:var(--thick),var(--sh);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s,transform .2s var(--ease),background .15s}
#actTag .m{display:block;flex:none;position:relative;width:62px;height:10px;border-radius:var(--pill);background:#efe4d6;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(120,90,60,.12)}
#actTag .m i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);border-radius:var(--pill);background:linear-gradient(90deg,#ffe48c,var(--lemon))}
#actTag .m s{position:absolute;top:0;bottom:0;left:74%;width:16%;background:rgba(255,178,26,.55);box-shadow:inset 0 0 0 1.5px #fff;text-decoration:none;display:none}
#actTag .m b{position:absolute;top:0;bottom:0;left:calc(var(--p,0) * 100%);width:4px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);display:none}
#actTag span{font-size:var(--f2);font-weight:900;color:var(--ink);letter-spacing:.02em;min-width:3.5em}
#act.charging #actTag,#act.timed #actTag{opacity:1;transform:translate(0,-50%)}

#sheet.show .card{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 6px;flex:none}
#sheet .hd{display:flex;align-items:center;gap:6px;padding:2px 12px 12px;flex:none}
.seg{flex:1;display:flex;background:var(--bg2);border-radius:var(--pill);padding:4px;box-shadow:inset 0 0 0 1.5px var(--line);min-width:0}
.seg button{flex:1;position:relative;height:40px;min-width:0;border-radius:var(--pill);font-size:var(--f2);font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;transition:background var(--dur),color var(--dur),box-shadow var(--dur)}
.seg button svg.i{width:17px;height:17px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--edge),var(--sh-s)}
.seg button.on svg.i{color:var(--pri)}
.seg .dot{top:4px;right:6px;width:8px;height:8px;box-shadow:none}
#sheet .body{flex:1;overflow-y:auto;padding:0 14px calc(18px + var(--sb));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.blk{background:#fff;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--thick),var(--sh-s)}
.cap{font-size:var(--f1);color:var(--ink2);font-weight:600}
.h{font-size:var(--f2);font-weight:800}
.sect{font-size:var(--f1);font-weight:700;color:var(--ink2);margin:14px 4px 8px}
.bar{height:8px;border-radius:var(--pill);background:var(--bg2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:var(--pill);background:linear-gradient(90deg,#86e9d9,var(--mint))}
.feat{display:flex;align-items:center;gap:12px}
.feat img{width:64px;height:48px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(90,60,30,.15))}
.feat .m{flex:1;min-width:0}
.tagc{display:inline-block;font-size:var(--f1);font-weight:800;color:var(--pri-d);background:var(--pri-l);padding:0 9px;border-radius:var(--pill);line-height:22px}
.subseg{display:inline-flex;background:var(--bg2);border-radius:var(--pill);padding:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.subseg button{height:36px;padding:0 16px;border-radius:var(--pill);font-size:var(--f1);font-weight:700;color:var(--ink2)}
.subseg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.sh-tank{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--mint-l),#fff);border-radius:20px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--thick),var(--sh-s)}
.sh-tank .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mint);color:#fff;flex:none}
.sh-tank .m{flex:1;min-width:0;font-size:var(--f1);color:var(--ink2);line-height:1.4}
.sh-tank .m b{display:block;font-size:var(--f2);color:var(--ink);font-weight:800}
.sh-tank button{height:44px;padding:0 14px;border-radius:var(--pill);background:#fff;color:var(--mint-t);font-weight:800;white-space:nowrap;box-shadow:0 3px 0 var(--edge),0 0 0 1.5px var(--mint) inset}
.sh-tank button:active{transform:translateY(2px)}
.cx-top{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-bottom:10px}
.cx-sum{background:#fff;border-radius:20px;box-shadow:var(--thick),var(--sh-s);padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:var(--f1);color:var(--ink2);white-space:nowrap}
.cx-sum em{font-style:normal;display:inline-flex;align-items:baseline;gap:4px;line-height:1}
.cx-sum b{font-size:var(--f3);color:var(--ink);line-height:1}.cx-sum i{flex:none;width:1px;height:16px;background:var(--line)}
.luck{background:linear-gradient(135deg,var(--lemon-l),#fff);border-radius:20px;box-shadow:var(--thick),var(--sh-s);padding:9px 12px}
.luck .row{display:flex;justify-content:space-between;align-items:center;font-size:var(--f1);font-weight:700;color:var(--lemon-t);margin-bottom:6px;gap:6px}
.luck .row span{display:flex;align-items:center;gap:3px}.luck .row .i{width:14px;height:14px;stroke:var(--lemon-d)}
.luck .row b{font-size:var(--f1);white-space:nowrap}
.lbar{position:relative;height:10px;border-radius:9px;background:#f8ecc8;overflow:hidden}
.lbar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,#ffe48c,var(--lemon));transition:width .5s var(--ease)}
.lbar s{position:absolute;top:2px;bottom:2px;width:1.5px;background:rgba(255,255,255,.8);text-decoration:none}
.cx-bar{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 2px}
.cx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cx{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--thick),var(--sh-s);transition:transform .3s var(--spring)}
.cx:active{transform:scale(.97);transition-duration:.06s}
.cx .ph{position:relative;height:96px;background:radial-gradient(120% 90% at 50% 30%,#fff 0%,color-mix(in srgb,var(--rc) 22%,#fff6ea) 100%);display:flex;align-items:center;justify-content:center}
.cx .ph img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s;filter:drop-shadow(0 4px 5px rgba(90,60,30,.16))}
.cx .ph img.ok{opacity:1}
.cx .ph .em{font-size:44px}
.cx .ph .rb{position:absolute;left:8px;top:8px}
.cx .ph .dk{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:2px;font-size:var(--f1);font-weight:800;color:var(--lemon-t);background:rgba(255,255,255,.9);border-radius:10px;padding:1px 7px 1px 4px}
.cx .ph .dk .i{width:13px;height:13px;stroke:var(--lemon-d)}
.cx .t{padding:8px 11px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.cx .t b{font-size:var(--f2);font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx .t span{font-size:var(--f1);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx .t .w{color:var(--mint-t);font-weight:700}
.cx .t .by{color:var(--ink3)}
.cx-detail{position:relative;animation:rise var(--dur) var(--ease);padding:0 0 12px;overflow:hidden}
.cx-detail .ph{height:150px;margin:-12px -12px 0;background:radial-gradient(120% 90% at 50% 30%,#fff 0%,color-mix(in srgb,var(--rc) 26%,#fff6ea) 100%);display:flex;align-items:center;justify-content:center}
.cx-detail .ph img{height:100%;object-fit:contain;opacity:0;transition:opacity .3s}.cx-detail .ph img.ok{opacity:1}
.cx-detail .em.big{font-size:64px}
.cx-detail .h{font-size:var(--f3);padding:10px 2px 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cx-detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:2px;margin:0;font-size:var(--f1)}
.cx-detail dt{color:var(--ink3)}.cx-detail dd{margin:0;color:var(--ink);font-weight:600}
.cx-detail .note{margin:8px 0 0;padding:8px 10px;border-radius:12px;background:var(--lemon-l);color:var(--lemon-t);font-weight:700;font-size:var(--f1)}
.cx-detail .x{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);box-shadow:var(--sh-s)}
.cx-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 10px;line-height:1.6;text-align:center;color:var(--ink2);font-size:var(--f2)}
.cx-empty .i{width:40px;height:40px;stroke:var(--mint);opacity:.7}.cx-empty b{font-size:var(--f3);color:var(--ink)}
.li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--thick),var(--sh-s)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:var(--f2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m span{display:block;font-size:var(--f1);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .no{width:26px;text-align:center;font-size:var(--f3);font-weight:900;color:var(--ink3)}
.li .no.g1{color:var(--lemon-d)}.li .no.g2{color:#9db3c2}.li .no.g3{color:#e09a6a}
.li .sc{font-size:var(--f3)}
.li.you{background:linear-gradient(90deg,var(--mint-l),#fff);box-shadow:0 3px 0 #cdeee6,0 0 0 2px var(--mint) inset}
.li .av{width:38px;height:38px}
.avw-on{position:relative;flex:none;display:inline-flex}
.on-dot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2.5px #fff;z-index:1}
.li.you .on-dot{box-shadow:0 0 0 2.5px var(--mint-l)}
.room{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:var(--f1);font-weight:700;color:var(--mint-t)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:breathe 1.4s infinite}
.mates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--bg2);min-height:44px}
.mate:active{transform:scale(.96)}
.mate .av{width:38px;height:38px}
.mate b{font-size:var(--f1);font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mate span{font-size:var(--f1);color:var(--ink2);white-space:nowrap}
.mate.hot span{color:var(--pri-d);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{border-radius:14px;padding:7px 0;text-align:center;font-size:var(--f1);color:var(--ink2);background:var(--bg2);display:flex;flex-direction:column;align-items:center;gap:2px}
.week div svg{width:17px;height:17px}
.week div.got{background:var(--mint-l);color:var(--mint-t)}
.week div.today{box-shadow:0 0 0 2px var(--pri) inset;color:var(--pri-d)}
.task .m .bar{margin-top:6px}
.task button{height:44px;min-width:76px;padding:0 14px;border-radius:var(--pill);font-size:var(--f2);font-weight:800;background:var(--bg2);color:var(--ink3);flex:none}
.task button.go{background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 3px 0 var(--pri-d)}
.task button.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri-d)}
.task button.ok{background:var(--mint-l);color:var(--mint-t)}
.empty{text-align:center;padding:40px 0;color:var(--ink3);font-size:var(--f2);font-weight:700}

/* ---------- 道具格子（装扮间 / 背包共用）---------- */
.it-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--edge),0 0 0 1.5px var(--line) inset;min-width:0;min-height:96px;transition:transform .3s var(--spring),box-shadow .15s,opacity .2s}
.it:active{transform:scale(.94);transition-duration:.06s}
.it .ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--f4);line-height:1;background:var(--ic);box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--rc)}
.it .nm{font-size:var(--f1);font-weight:700;line-height:1.2;text-align:center;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;padding:0 3px;min-height:2.4em}
.it .ct{position:absolute;right:5px;top:5px;min-width:24px;height:20px;padding:0 6px;border-radius:10px;font-size:var(--f1);font-weight:800;line-height:20px;text-align:center;color:var(--ink2);background:var(--bg2)}
.it.on{background:var(--pri-l);box-shadow:0 3px 0 #f6c9cf,0 0 0 2.5px var(--pri) inset}
.it.on .ck{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.it.on .ck svg{width:15px;height:15px;stroke-width:3}
.it.pop{animation:itPop .42s var(--spring)}
@keyframes itPop{0%{transform:scale(.86)}55%{transform:scale(1.08) translateY(-3px)}100%{transform:none}}
.it.dim{opacity:.5}
.it.lock{opacity:1;background:var(--bg2);box-shadow:0 0 0 1.5px var(--line) inset}
.it.lock .ico{filter:grayscale(1);opacity:.35;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--line)}
.it.lock .nm{color:var(--ink3)}
.it.sel{box-shadow:0 3px 0 var(--edge),0 0 0 2.5px var(--grape) inset}
.it-sect{grid-column:1/-1;font-size:var(--f1);font-weight:700;color:var(--ink3);margin:6px 2px 0}
.bag-hd{display:flex;align-items:center;gap:12px;padding:12px}
.bag-hd .ico{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--ic);box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--rc);flex:none}
.bag-hd .m{flex:1;min-width:0}
.bag-hd .m b{display:flex;align-items:center;gap:6px;font-size:var(--f3);font-weight:800;flex-wrap:wrap}
.bag-hd .m p{font-size:var(--f1);color:var(--ink2);line-height:1.5;margin-top:3px}
.bag-hd .m .fx{display:inline-block;margin-top:6px;font-size:var(--f1);font-weight:700;color:var(--grape-t);background:var(--grape-l);border-radius:var(--pill);padding:2px 9px}
.bag-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px;padding:2px}
.bag-cats::-webkit-scrollbar{display:none}

/* ---------- 弹窗：一个标题 · 一个奖励 · 一个按钮 ---------- */
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
#modal.show{opacity:1;pointer-events:auto}
#modal .box{width:min(310px,84%);background:var(--bg);border-radius:28px;padding:26px 20px 20px;text-align:center;transform:scale(.8);transition:transform .4s var(--spring);box-shadow:var(--sh-l)}
#modal.show .box{transform:none}
#modal .badge{width:76px;height:76px;margin:-62px auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffe48c,var(--lemon));color:#6b4800;box-shadow:0 0 0 5px var(--bg),0 4px 0 5px var(--lemon-d),0 12px 24px rgba(232,180,44,.35)}
#modal .badge svg{width:36px;height:36px;stroke-width:2.3}
#modal h2{font-size:var(--f3);font-weight:800;color:var(--ink);line-height:1.4}
#modal .rw{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:var(--f2);font-weight:800;color:var(--lemon-t);background:var(--lemon-l);padding:7px 16px;border-radius:var(--pill)}
#modal .rw svg{width:17px;height:17px;color:var(--lemon-d)}
#modal .btn-p{margin-top:20px}

/* ---------- 拍照 / 轻提示 / 飘字 ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
#flash.go{animation:flash .5s var(--ease)}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#polaroid{position:absolute;left:50%;top:44%;z-index:26;width:74%;background:#fff;padding:10px 10px 14px;border-radius:14px;box-shadow:var(--sh-l);transform:translate(-50%,-50%) rotate(-3deg) scale(.85);opacity:0;pointer-events:none;transition:transform .36s var(--spring),opacity var(--dur)}
#polaroid.show{transform:translate(-50%,-50%) rotate(-3deg);opacity:1;pointer-events:auto}
#polaroid img{width:100%;display:block;border-radius:8px;aspect-ratio:4/5;object-fit:cover}
#polaroid .pc{font-size:var(--f2);font-weight:800;margin-top:8px;text-align:center}
#polaroid .pc small{display:block;font-size:var(--f1);color:var(--ink2);font-weight:500;margin-top:2px}
#toast{position:absolute;left:50%;top:calc(136px + var(--st));transform:translate(-50%,-50%) scale(.9);background:#fff;color:var(--ink);font-weight:800;font-size:var(--f2);padding:11px 20px;border-radius:20px;opacity:0;transition:opacity .2s,transform .36s var(--spring);pointer-events:none;white-space:nowrap;z-index:15;text-align:center;line-height:1.5;box-shadow:var(--thick),var(--sh-l)}
#toast small{display:block;font-size:var(--f1);font-weight:600;color:var(--ink2)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.accent{background:linear-gradient(180deg,#fff,var(--lemon-l));box-shadow:0 3px 0 #f3dfa6,var(--sh-l)}
#float{position:absolute;inset:0;pointer-events:none;z-index:14;overflow:hidden}
.fp{position:absolute;font-weight:900;font-size:var(--f4);color:#fff;text-shadow:0 2px 0 var(--c,var(--pri-d)),0 0 12px rgba(90,60,30,.25);animation:fp 1.3s var(--ease) forwards;white-space:nowrap}
@keyframes fp{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-12px) scale(1.08);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
#fps{position:absolute;left:8px;bottom:calc(4px + var(--sb));font-size:var(--f1);color:rgba(255,255,255,.7);pointer-events:none;font-family:monospace;z-index:6}
body.photo .ui > :not(#flash):not(#polaroid){opacity:0;transition:opacity .2s}

/* ---------- 开屏 v3：珍珠白留白 · Fish Party 手写品牌字 · 几条花纹各异的小鱼（UGC）慢慢游过 ----------
   动画只用 transform / opacity（合成线程），主线程加载 3D 时依旧顺滑；无 blur / backdrop-filter */
@font-face{font-family:'FP Round';src:url(assets/fonts/Fredoka-Party.woff2) format('woff2');font-weight:400 700;font-display:block}   /* v2.1 品牌字：Fredoka 粗圆体（OFL，已子集化只含 Fish Party） */
:root{--fp-sea:#1f86c9;--fp-sea2:#3fb2e2;--fp-sea3:#7fd6ee;--fp-sea-d:#15649e}
:root{--fp-bg:#fbf8f3;--fp-pink:#ec8fa3;--fp-pink2:#f4a7b6;--fp-ink:#8f847b;--fp-ink2:#b3a89e;--fp-line:#ebe3d9;--fp-ease:cubic-bezier(.22,.7,.2,1)}
#splash{position:absolute;inset:0;z-index:40;overflow:hidden;background:var(--fp-bg);color:var(--fp-ink);font-family:var(--font);transition:opacity .65s var(--fp-ease)}
#splash::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(140% 95% at 50% 44%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 50%,rgba(238,227,214,.32) 100%)}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-sea{position:absolute;inset:0;pointer-events:none;z-index:0}
#splash .sp-fish{position:absolute;left:0;top:var(--y);width:var(--w);opacity:0;animation:spSwim var(--d) linear var(--dl) infinite,spFade 1.6s var(--fp-ease) .2s forwards;will-change:transform}
#splash .sp-fish.l{animation-name:spSwimL,spFade}
#splash .sp-fb{animation:spBob var(--b,3.8s) ease-in-out infinite alternate}
#splash .sp-fish svg{display:block;width:100%;height:auto;overflow:visible}
#splash .sp-fish:not(.l) svg{transform:scaleX(-1)}
#splash .sp-fish .tail{transform-box:view-box;transform-origin:42px 16px;animation:spTail var(--t,.9s) ease-in-out infinite alternate}
@keyframes spSwim{from{transform:translate3d(-18vw,0,0)}to{transform:translate3d(112vw,0,0)}}
@keyframes spSwimL{from{transform:translate3d(112vw,0,0)}to{transform:translate3d(-18vw,0,0)}}
@keyframes spFade{to{opacity:var(--o,1)}}
@keyframes spBob{from{transform:translateY(calc(var(--a,6px) * -1)) rotate(-2deg)}to{transform:translateY(var(--a,6px)) rotate(2deg)}}
@keyframes spTail{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
#splash .sp-main{position:absolute;left:0;right:0;top:44%;z-index:2;display:flex;flex-direction:column;align-items:center;transform:translateY(-50%);transition:transform .7s var(--fp-ease)}
#splash.out .sp-main{transform:translateY(calc(-50% - 14px)) scale(1.03)}
#splash .sp-brand{margin:0;font:600 clamp(58px,19vw,88px)/.98 'FP Round',ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold',var(--font);letter-spacing:.015em;text-align:center;filter:drop-shadow(0 3px 0 #8fcde9) drop-shadow(0 12px 18px rgba(90,180,225,.22))}
/* 书写式揭示：外层窗口从左滑入、内层反向等速滑动 → 文字静止、右缘带柔边逐字"写"出来（纯 transform，合成线程） */

@keyframes eggBreath{0%,100%{box-shadow:0 0 0 1px rgba(214,150,50,.25) inset,0 0 5px 1px rgba(255,205,96,.35);filter:brightness(.97)}50%{box-shadow:0 0 0 1px rgba(214,150,50,.25) inset,0 0 14px 5px rgba(255,205,96,.7);filter:brightness(1.08)}}
.eg-ic .egg-orb{width:40px;height:40px}
.rm-cell.egg .em .egg-orb{width:30px;height:30px;vertical-align:middle}
.ib-it .ic .egg-orb{width:20px;height:20px}
.tk-btn .egg-orb{width:20px;height:20px;margin-right:6px}
/* （v1.3：原 .tk-foot 底部提示条 / 背包 / 串门按钮行已取消）*/
/* 卵倒计时标签 / 提示 / 飘字 */
.tk-lb{position:absolute;left:0;top:0;font-size:var(--f1);font-weight:800;color:var(--ink);background:rgba(255,250,243,.92);border-radius:var(--pill);padding:3px 10px;box-shadow:var(--sh);white-space:nowrap;transition:opacity .2s}
/* v1.3：旧版 ready 标签用 transform 无限 bob，会顶掉 JS 写入的定位 transform → 标签在卵和左上角之间来回「飞」。改为变黄时用独立 scale 属性弹一次，之后静止 */
.tk-lb.ready{background:var(--lemon);color:#6b4800;box-shadow:0 0 0 2px #fff,var(--sh);animation:lbPop .45s var(--spring) 1}
@keyframes lbPop{0%{scale:.6}60%{scale:1.12}100%{scale:1}}
.tk-toast{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:90%;top:calc(64px + var(--st));transform:translateY(-8px);text-align:center;font-size:var(--f2);font-weight:800;color:var(--ink);background:#fff;border-radius:20px;padding:10px 16px;box-shadow:var(--thick),var(--sh-l);opacity:0;transition:opacity .2s,transform .36s var(--spring);z-index:3;line-height:1.45;pointer-events:none}
.tk-toast small{display:block;font-size:var(--f1);color:var(--ink2);font-weight:600}
.tk-toast.show{opacity:1;transform:none}
.tk-toast.gold{background:linear-gradient(180deg,#fff,var(--lemon-l))}
.tk-float{position:absolute;left:50%;top:40%;white-space:nowrap;font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 var(--pri-d),0 0 18px rgba(255,212,92,.8);animation:tkfl 1.6s ease-out forwards;pointer-events:none}
@keyframes tkfl{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.tk-tip{position:absolute;left:0;right:0;margin:0 auto;top:calc(30% - 60px);z-index:4;width:min(330px,88%);box-sizing:border-box;text-align:center;font-size:var(--f3);font-weight:800;color:var(--ink);background:var(--bg);border-radius:22px;box-shadow:var(--sh-l);padding:16px 20px 14px;pointer-events:none;animation:popIn .5s var(--spring) both}
.tk-tip small{display:block;font-size:var(--f1);color:var(--ink2);font-weight:600;margin-top:4px}
.tk-tip button{margin-top:12px;height:44px;padding:0 26px;border-radius:var(--pill);color:#fff;background:linear-gradient(180deg,var(--pri2),var(--pri));box-shadow:0 3px 0 var(--pri-d);font-weight:800;font-size:var(--f2);pointer-events:auto}
.tk-tip::after{content:'';position:absolute;left:50%;top:100%;width:16px;height:16px;margin-left:-8px;margin-top:-8px;background:var(--bg);transform:rotate(45deg)}
/* 底部面板（介绍牌 / 卵卡 / 动态 / 串门）*/
.tk-sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--sb));background:var(--bg);border-radius:28px;box-shadow:var(--sh-l);padding:18px 16px 16px;pointer-events:auto;max-height:min(74%,calc(100% - 78px - var(--st) - var(--sb)));overflow-y:auto;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .42s cubic-bezier(.22,1,.36,1),visibility 0s linear .42s;touch-action:pan-y}
.tk-sheet.show{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.22,1,.36,1),visibility 0s}
.tk-x{position:absolute;right:12px;top:12px;z-index:2}
.fc-hd,.eg-hd,.lb-hd{display:flex;align-items:center;gap:12px;padding-right:48px}
.fc-th{width:96px;height:66px;border-radius:16px;background:linear-gradient(160deg,#eaf8f6,#dff0f4);object-fit:contain;flex:none}
.fc-th.sm{width:64px;height:44px;border-radius:12px}
.fc-m{min-width:0}
.fc-nm{font-size:var(--f3);font-weight:800;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fc-nm,.rv-nm,#cName{text-wrap:balance}   /* v1.1：长鱼名均衡换行，避免末行孤字 */
.fc-sub{font-size:var(--f1);font-weight:600;color:var(--ink2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:var(--f1);font-weight:700;color:var(--pri-d);background:var(--pri-l);border-radius:var(--pill);padding:2px 10px}
.pl-k{display:flex;align-items:center;gap:6px;font-size:var(--f1);font-weight:700;letter-spacing:.12em;color:var(--ink3);padding-right:48px;min-height:20px}
.pl-k i{width:7px;height:7px;border-radius:50%;background:var(--pri)}
.pl-hd{display:flex;align-items:center;gap:12px;margin-top:8px}
.pl-nm{font-size:var(--f4);font-weight:800;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* v2.3 改名：✏️ 小按钮 → 就地输入框 */
.pl-ed{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--bg2);box-shadow:0 0 0 1.5px var(--line) inset;flex:none}
.pl-ed svg.i{width:16px;height:16px;stroke-width:2.3}
.pl-ed:active{transform:scale(.9)}
.pl-nm.editing{flex-wrap:wrap;gap:6px;width:100%}
.pl-nm.editing input{flex:1 1 100%;min-width:0;height:40px;border:0;outline:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;border-radius:12px;padding:0 10px;font:800 var(--f3)/1 var(--font);color:var(--ink);background:#fff;box-shadow:0 0 0 2px var(--grape) inset}
.pl-nm.editing input.roll{animation:popIn .35s var(--spring)}
.pl-eb{width:36px;height:36px;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--bg2)}
.pl-eb svg.i{width:18px;height:18px;stroke-width:2.3}
.pl-eb.ok{color:#fff;background:var(--mint);box-shadow:0 2px 0 var(--mint-d)}
.pl-eb.dice{color:var(--grape-t);background:var(--grape-l)}
.pl-eb:active{transform:translateY(1px)}
.pl-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:var(--f1);font-weight:600;color:var(--ink2)}
.pl-meta b{color:var(--ink);font-weight:800}
.pl-meta .mut{color:var(--pri-d)}
.pl-desc{position:relative;margin-top:12px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--bg2);font-size:var(--f2);line-height:1.6;font-weight:500;color:#5a4f48}
.pl-desc::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--lemon)}
.pl-by{margin-top:8px;font-size:var(--f1);color:var(--ink2);font-weight:600}
.pl-by b{color:var(--ink);font-weight:800}
.pl-acts{display:flex;gap:10px;margin-top:14px}
.pl-acts .tk-btn.main{flex:1.4}
.pl-acts .tk-btn.sub{flex:1;height:56px}
.eg-ic{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 40% 35%,#fffdf4,#fff1cc 70%);flex:none}
.eg-ic .i{width:34px;height:34px;color:var(--pri-d)}
.eg-ic.fuse .i{color:var(--grape-t)}
.rv-list .i{width:16px;height:16px;vertical-align:-3px;margin-right:4px;color:var(--grape-t)}
.ib-it .ic .i{width:20px;height:20px;color:var(--ink2)}
.eg-ic.fuse{background:radial-gradient(circle at 40% 35%,#fffdf4,#ffeac0 70%)}
.eg-bar{height:10px;border-radius:var(--pill);background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:16px;overflow:hidden}
.eg-bar i{display:block;height:100%;width:0;border-radius:var(--pill);background:linear-gradient(90deg,var(--mint),var(--lemon));transition:width .25s linear}
/* v0.9.1：卵卡没有 .eg-card 类 → 原 margin 从未生效，加速按钮贴着进度条。改为跟在进度条后的兄弟选择器，进度条与按钮间留 22px 呼吸 */
.eg-bar + .tk-btn.main{margin-top:22px}
.eg-note{font-size:var(--f1);font-weight:600;color:var(--ink3);text-align:center;margin-top:10px;min-height:16px}
.lb-hd b{display:block;font-size:var(--f3);font-weight:800}
.lb-hd span{font-size:var(--f1);color:var(--ink2);font-weight:600}
.lb-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:var(--pill);padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.lb-tabs button{flex:1;height:44px;border-radius:var(--pill);font-size:var(--f2);font-weight:800;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.lb-tabs button svg.i{width:19px;height:19px}
.lb-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--edge),var(--sh-s)}
.lb-tabs button.on svg.i{color:var(--pri)}
.lb-cap{font-size:var(--f1);font-weight:700;color:var(--ink2);margin:12px 2px 8px}
.lb-cap.c{text-align:center;margin:8px 0 0}
.lb-grid,.rm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb-cell,.rm-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--edge),0 0 0 1.5px var(--line) inset;min-width:0;transition:transform .3s var(--spring)}
.lb-cell img,.rm-cell img{width:100%;height:40px;object-fit:contain}
.lb-cell img:not(.ok),.rm-cell img:not(.ok){visibility:hidden}
.lb-cell:has(img:not(.ok))::before,.rm-cell:has(img:not(.ok))::before{content:'';position:absolute;left:50%;top:14px;width:40px;height:26px;margin-left:-20px;border-radius:50%;background:var(--bg2);animation:thPulse 1.1s ease-in-out infinite alternate}
@keyframes thPulse{to{opacity:.4}}
.lb-cell span,.rm-cell span{font-size:var(--f1);font-weight:700;max-width:100%;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;min-height:2.4em}
.lb-cell.on,.rm-cell.on{background:var(--pri-l);box-shadow:0 3px 0 #f6c9cf,0 0 0 2.5px var(--pri) inset;transform:translateY(-2px)}
.rm-cell em{font-style:normal;font-size:var(--f1);font-weight:800;color:var(--pri-d)}
.rm-cell.new{background:var(--lemon-l);box-shadow:0 3px 0 #f3dfa6,0 0 0 1.5px #f5d98a inset}
.rm-cell.new.on{background:var(--pri-l);box-shadow:0 3px 0 #f6c9cf,0 0 0 2.5px var(--pri) inset}
.rm-cell .nb{position:absolute;left:-2px;top:-6px;font-style:normal;font-size:var(--f1);font-weight:800;color:#fff;background:var(--pri);border-radius:8px;padding:0 6px;line-height:18px;z-index:1}
.rm-cell.egg{background:var(--bg2);box-shadow:none;justify-content:center;opacity:.8}
.rm-cell.egg .em{font-size:26px;line-height:40px}
.lb-prev{display:flex;align-items:center;gap:8px;margin-top:10px}
.lb-prev>div{flex:1;background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:var(--f1);min-width:0;box-shadow:0 0 0 1.5px var(--line) inset}
.lb-prev>div b{font-size:var(--f1);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-prev>div span{background:var(--mint-l);color:var(--mint-t);border-radius:8px;padding:1px 7px;font-weight:700}
.lb-prev em{font-style:normal;font-size:var(--f4);font-weight:900;color:var(--ink3)}
.lb-empty{text-align:center;font-size:var(--f2);font-weight:600;color:var(--ink2);padding:22px 0 8px;line-height:1.7}
/* 确认 / 揭晓 */
.tk-confirm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--scrim);pointer-events:auto;z-index:6}
.tk-confirm.show{display:flex}
.tk-confirm .box{width:min(310px,84%);background:var(--bg);border-radius:28px;box-shadow:var(--sh-l);padding:22px 18px 10px;text-align:center;animation:popIn .4s var(--spring)}
.tk-confirm h3{font-size:var(--f3);font-weight:800;margin-top:6px;line-height:1.4}
.tk-confirm p{font-size:var(--f2);font-weight:500;color:var(--ink2);margin:6px 0 16px;line-height:1.5}
.cf-ic{width:64px;height:64px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sky-l);color:var(--sky-t)}
.cf-ic svg.i{width:32px;height:32px}
.tk-reveal{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(14px + var(--sb));background:linear-gradient(180deg,rgba(20,40,50,0) 40%,rgba(58,46,38,.32));pointer-events:auto;z-index:5}
.tk-reveal.show{display:flex}
.rv-card{width:min(340px,90%);background:var(--bg);border-radius:28px;box-shadow:var(--sh-l);padding:18px 18px 16px;text-align:center;animation:rvin .5s var(--spring)}
@keyframes rvin{from{transform:scale(.6) rotate(-3deg);opacity:0}}
.rv-big{display:inline-flex;align-items:center;gap:6px;font-size:var(--f2);font-weight:800;letter-spacing:.1em;color:var(--mint-t);background:var(--mint-l);border-radius:var(--pill);padding:4px 14px}
.rv-card.mut{background:linear-gradient(180deg,#fff3d1,var(--bg) 55%);box-shadow:var(--sh-l),0 0 0 4px rgba(255,212,92,.5),0 0 40px rgba(255,212,92,.4)}
.rv-card.mut .rv-big{color:#6b4800;background:var(--lemon);font-size:var(--f3)}
.rv-nm{font-size:var(--f4);font-weight:800;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.rv-sub{font-size:var(--f1);font-weight:600;color:var(--ink2);margin-top:4px}
.rv-list{margin-top:10px;display:flex;flex-direction:column;gap:5px;text-align:left;max-height:24vh;overflow-y:auto}
.rv-list div{font-size:var(--f2);font-weight:600;background:var(--bg2);border-radius:12px;padding:6px 10px}
.rv-list div.w{background:var(--lemon-l);color:var(--lemon-t)}
.rv-card .tk-btn.main{margin-top:14px}
.rv-ba{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 2px}
.rv-ba .o,.rv-ba .n{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rv-ba img{display:block;width:74px;height:52px;object-fit:contain;border-radius:14px;background:linear-gradient(160deg,#f6f0e8,#ece4da);filter:saturate(.8)}
.rv-ba .o span{max-width:78px;font-size:var(--f1);font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-ba .n img{width:120px;height:84px;background:linear-gradient(160deg,#eaf8f6,#d9eff2);filter:none;box-shadow:0 6px 16px rgba(47,183,161,.22),0 0 0 2.5px var(--mint);animation:popIn .6s var(--spring) .15s both}
.rv-card.mut .rv-ba .n img{background:linear-gradient(160deg,#fff4dc,#ffe6c0);box-shadow:0 6px 16px rgba(220,150,30,.22),0 0 0 2.5px var(--lemon)}
.rv-ba .n span{font-size:var(--f1);font-weight:800;color:#fff;background:var(--pri);border-radius:8px;padding:0 7px;margin-top:3px}
.rv-ba em{font-style:normal;font-weight:900;color:var(--ink3)}
.rv-ba em.ar{font-size:var(--f4);color:var(--mint-d)}
.rv-ba.two{gap:3px}.rv-ba.two .o img{width:58px;height:42px}.rv-ba.two .o span{max-width:60px}.rv-ba.two .n img{width:104px;height:72px}
/* 突变 / 放生 演出 */
.mut-shake{animation:mutShake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes mutShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}
.mut-burst{position:absolute;left:0;right:0;top:20%;z-index:7;text-align:center;pointer-events:none;font-size:56px;font-weight:900;letter-spacing:.12em;color:#fff6dc;text-shadow:0 0 24px rgba(255,214,140,.9),0 0 60px rgba(255,190,90,.6),0 4px 0 var(--lemon-d);animation:mutIn 2s var(--spring) forwards}
.mut-burst small{display:block;font-size:var(--f3);font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3);margin-top:4px}
@keyframes mutIn{0%{transform:scale(3);opacity:0}14%{transform:scale(.9);opacity:1}22%{transform:scale(1.08)}30%,80%{transform:scale(1);opacity:1}100%{transform:scale(1.2) translateY(-30px);opacity:0}}
.mut-flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,244,214,.88),rgba(255,200,180,.3) 42%,transparent 72%);animation:mutFl 1.1s ease-out forwards}
@keyframes mutFl{from{opacity:1}to{opacity:0}}
.mut-rays{position:absolute;left:50%;top:30%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:6;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,230,180,.34) 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,#000 8%,transparent 40%);mask:radial-gradient(circle,#000 0,#000 8%,transparent 40%);animation:mutRays 2.2s ease-out forwards}
@keyframes mutRays{0%{transform:scale(.2) rotate(0);opacity:0}15%{opacity:1}100%{transform:scale(1.15) rotate(70deg);opacity:0}}
.mut-dim{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 25%,rgba(30,25,20,.42) 80%);animation:mutDim 2.2s ease-out forwards}
@keyframes mutDim{0%{opacity:0}12%,70%{opacity:1}100%{opacity:0}}
.mut-spark{position:absolute;left:50%;top:30%;z-index:7;width:10px;height:22px;margin:-11px 0 0 -5px;pointer-events:none;background:linear-gradient(180deg,#fff,#ffe08a);clip-path:polygon(50% 0,100% 40%,62% 46%,100% 100%,0 52%,40% 48%,0 0);filter:drop-shadow(0 0 6px rgba(255,214,140,.9));animation:mutSpark 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.mut-spark.p{background:linear-gradient(180deg,#fff,#d4c6ff)}
@keyframes mutSpark{0%{transform:translate(0,0) rotate(var(--r)) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.3);opacity:0}}
.rel-wave{position:absolute;left:0;right:0;top:38%;z-index:5;text-align:center;pointer-events:none;animation:popIn .5s var(--spring) both}
.rel-wave b{display:inline-block;font-size:var(--f4);font-weight:800;letter-spacing:.1em;color:#fff;text-shadow:0 2px 16px rgba(0,40,50,.4),0 0 30px rgba(190,250,240,.6)}
.rel-wave span{display:inline-block;margin-top:8px;font-size:var(--f1);font-weight:700;color:var(--ink);background:rgba(255,250,243,.94);border-radius:var(--pill);padding:6px 14px;box-shadow:var(--sh)}
/* 动态 / 串门列表 */
.ib-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:52vh;overflow-y:auto;touch-action:pan-y;padding:2px 2px 6px}
.ib-it{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 10px;box-shadow:0 0 0 1.5px var(--line) inset}
.ib-it.creator{background:linear-gradient(90deg,var(--lemon-l),#fff)}
.ib-it.caught{background:linear-gradient(90deg,var(--mint-l),#fff)}
.ib-it .ic{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:var(--f3);background:var(--bg2)}

      <div class="btn"><span class="ic" id="actIc"></span><span class="lb" id="actLb">抛竿</span></div>
      <div id="actTag"><i class="m"><i></i><s></s><b></b></i><span id="actTagT"></span></div>
      <div id="dist"><svg class="i" viewBox="0 0 24 24"><path d="M3 12c3-4.5 9-6 14-2l4-3v10l-4-3c-5 4-11 2.5-14-2z"/><circle cx="8" cy="11" r=".6"/></svg><b class="num" id="distN">0m</b><span id="distTip"></span></div>
    </div>

    <div id="catch" class="glass">
      <div class="hd"><span class="rb" id="cRar">SR</span><span id="cName">鱼</span><span id="cNew" class="hidden">NEW</span></div>
      <button id="photoBtn" aria-label="合影"><svg class="i" viewBox="0 0 24 24"><path d="M4 8.5h3l2-3h6l2 3h3V19H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <div class="mid"><span id="cMeta"></span><span class="pts"><span id="cCombo"></span><b class="num" id="cPts">+0</b></span></div>
      <div id="cChips"></div>
      <button id="cMore"><span id="cBy"></span><span class="sp"></span>详情<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <div id="cDetail"></div>
      <div class="cActs"><button id="cKeep">收进水族箱</button><button id="cFree" aria-label="抛回大海"><svg class="i" viewBox="0 0 24 24"><path d="M3 15c2 0 2-1.6 4.5-1.6S10 15 12 15s2-1.6 4.5-1.6S19 15 21 15"/><path d="M3 19c2 0 2-1.6 4.5-1.6S10 19 12 19s2-1.6 4.5-1.6S19 19 21 19"/><path d="M12 11V4m0 0l-3 3m3-3l3 3"/></svg><span>抛回大海</span></button></div>
    </div>

    <div id="flash"></div>
    <div id="polaroid"><img id="polImg" alt="" /><div class="pc" id="polCap"></div></div>
    <div id="float"></div>
    <div id="toast"></div>
  </div>

  <div id="sheet"><div class="card"><div class="grab"></div>
    <div class="hd"><button class="ib hidden" id="shBack" aria-label="返回菜单"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><div class="sh-tt" id="shTitle"></div><div id="shTabs" class="hidden"></div><button class="ib" id="sndBtn" aria-label="声音"></button><button class="ib" id="shX" aria-label="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="body" id="shBody"></div></div></div>
  <div id="modal"><div class="box" id="mBox"></div></div>

  <div id="splash">
    <div class="sp-sea" id="spSea" aria-hidden="true"></div>
    <div class="sp-main">
      <h1 class="sp-brand" aria-label="Fish Party"><span class="sp-wipe"><span class="sp-ink"><span class="sp-ln"><i style="--i:0">F</i><i style="--i:1">i</i><i style="--i:2">s</i><i style="--i:3">h</i></span><span class="sp-ln"><i style="--i:4">P</i><i style="--i:5">a</i><i style="--i:6">r</i><i style="--i:7">t</i><i style="--i:8">y</i></span></span></span></h1>
      <i class="sp-rule"></i>
      <div class="sp-sub">神奇钓鱼派对</div>
    </div>
    <div class="sp-load" role="status" aria-live="polite">
      <div class="sp-track"><i id="loadBar"></i></div>
      <div id="loadT">正在连接房间…</div>
    </div>
    <button id="start">开始派对</button>
    <div class="sp-foot">每一条鱼，都独一无二</div>
  </div>
  <script>
  // 开屏：5 条花纹各不相同的极简小鱼（条纹 / 波点 / 渐变 / 星星 / 线描 —— 暗示 UGC），低饱和、慢速、留白；纯 SVG + CSS transform
  (function () {
    var sea = document.getElementById('spSea'); if (!sea) return;
    var BODY = 'M3 16C8 6.5 25 4 36 13.2L39 16L36 18.8C25 28 8 25.5 3 16Z';
    var TAIL = 'M37.5 16L46.5 8.2Q43.6 16 46.5 23.8Z', FIN = 'M15.5 7.8Q21 2.6 27.5 7.2Z';
    var STAR = function (x, y, r) { return 'M' + x + ' ' + (y - r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x - r) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y - r) + 'Z'; };
    function fish(i, kind, c1, c2) {
      var id = 'spf' + i, pat = '', fill = c1, defs = '<clipPath id="' + id + 'c"><path d="' + BODY + '"/></clipPath>';
      if (kind === 'stripe') pat = [12, 19.5, 27].map(function (x) { return '<rect x="' + x + '" y="0" width="3.4" height="32" fill="' + c2 + '"/>'; }).join('');
      if (kind === 'dots') pat = [[12, 11, 1.7], [18, 17, 2.1], [25, 11.5, 1.5], [26, 20, 1.8], [32, 15, 1.4], [13, 21, 1.3]].map(function (d) { return '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="' + d[2] + '" fill="' + c2 + '"/>'; }).join('');
      if (kind === 'grad') { defs += '<linearGradient id="' + id + 'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient>'; fill = 'url(#' + id + 'g)'; }
      if (kind === 'star') pat = '<path d="' + STAR(15, 12, 2.6) + STAR(24, 18.5, 2) + STAR(31, 12.5, 1.6) + STAR(19, 21, 1.2) + '" fill="' + c2 + '"/>';
      var line = kind === 'line', st = line ? ' fill="none" stroke="' + c1 + '" stroke-width="1.1" stroke-linejoin="round"' : ' fill="' + fill + '"';
      return '<svg viewBox="0 0 48 32"><defs>' + defs + '</defs><g class="tail"><path d="' + TAIL + '"' + (line ? st : ' fill="' + (kind === 'grad' ? c2 : c1) + '"') + '/></g>'
        + '<path d="' + FIN + '"' + (line ? st : ' fill="' + c1 + '" opacity=".75"') + '/><path d="' + BODY + '"' + st + '/>'
        + (pat ? '<g clip-path="url(#' + id + 'c)">' + pat + '</g>' : '') + (line ? '<path d="M27 9.6Q24.2 16 27 22.4" fill="none" stroke="' + c1 + '" stroke-width="1" stroke-linecap="round"/>' : '')
        + '<circle cx="9.6" cy="14.6" r="1.25" fill="#6f625a" opacity=".55"/></svg>';
    }
    // [花纹, 主色, 辅色, top%, 宽px, 周期s, 起点(负延迟比例), 方向, 不透明度, 尾摆s]
    var F = [
      ['stripe', '#efb4c0', '#fbe6ea', 14, 46, 38, .30, 'r', .9, .95],
      ['dots', '#a8cec2', '#eef6f2', 25, 34, 46, .72, 'l', .8, 1.1],
      ['grad', '#f4d7a3', '#f1b3a6', 60, 52, 42, .55, 'l', .85, 1.0],
      ['star', '#b5cee5', '#ffffff', 68, 30, 50, .12, 'r', .75, .85],
      ['line', '#cbb3d6', '#cbb3d6', 77, 40, 54, .86, 'r', .9, 1.2]
    ];
    sea.innerHTML = F.map(function (f, i) {
      return '<div class="sp-fish ' + (f[7] === 'l' ? 'l' : '') + '" style="--y:' + f[3] + '%;--w:' + f[4] + 'px;--d:' + f[5] + 's;--dl:' + (-f[5] * f[6]).toFixed(1) + 's;--o:' + f[8] + '"><div class="sp-fb" style="--b:' + (3.2 + i * .45) + 's;--a:' + (4 + i % 3 * 2) + 'px;animation-delay:-' + i * 0.9 + 's">'
        + fish(i, f[0], f[1], f[2]).replace('class="tail"', 'class="tail" style="--t:' + f[9] + 's"') + '</div></div>';
    }).join('');
  })();
  </script>
  <div id="fps"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
