<!doctype html><html lang="en"><meta charset="utf-8"><title>Inspiration Garden — art proof</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf9eb;color:#485044;font:13px system-ui;padding:24px}h1{font-size:22px;margin:0 0 6px}p{margin:0 0 20px;color:#737967}.grid{display:grid;grid-template-columns:repeat(4,220px);gap:12px}.card{border:1px solid #d5dcc6;border-radius:16px;overflow:hidden;background:#fffdf4}.name{padding:10px 12px;font-weight:600}.meta{padding:0 12px 12px;font-size:10px;color:#81856d}canvas{display:block;width:220px;height:145px;background:#b4dcd5}</style><h1>Illustrated garden assets — source rectangle proof</h1><p>Reference-driven warm contours • 100 px scene view + 40 px inventory view • red cross = ground anchor</p><div class="grid" id="grid"></div><script type="module">
const m=await(await fetch('art-manifest.json')).json();const images={};
await Promise.all(Object.values(m.atlases).map(a=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[a.image]=im;resolve()};im.onerror=reject;im.src='../'+a.image})));
for(const [key,s] of Object.entries(m.sprites)){const card=document.createElement('div');card.className='card';const c=document.createElement('canvas');c.width=440;c.height=290;card.append(c);const name=document.createElement('div');name.className='name';name.textContent=key;card.append(name);const meta=document.createElement('div');meta.className='meta';meta.textContent=s.kind+' · '+s.frame.w+'×'+s.frame.h+' · anchor '+s.anchor.join(', ');card.append(meta);grid.append(card);const ctx=c.getContext('2d');ctx.scale(2,2);const f=s.frame;const draw=(x,y,w)=>{const h=w*f.h/f.w;ctx.drawImage(images[s.image],f.x,f.y,f.w,f.h,x-w*s.anchor[0],y-h*s.anchor[1],w,h)};ctx.fillStyle='#a3cabe';ctx.beginPath();ctx.ellipse(72,124,39,8,0,0,Math.PI*2);ctx.fill();draw(72,125,110);draw(172,125,42);ctx.strokeStyle='#be7868';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(68,125);ctx.lineTo(76,125);ctx.moveTo(72,121);ctx.lineTo(72,129);ctx.stroke()}document.body.dataset.ready='1';
</script></html>
